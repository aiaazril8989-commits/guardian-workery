name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyGuardianApp'
      package_name:
        description: 'Package Name (cth: com.guardian.app)'
        required: true
        default: 'com.guardian.app'
      uid:
        description: 'UID Pengguna'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Print Config Info
        run: |
          echo "Building App: ${{ github.event.inputs.app_name }}"
          echo "Package Name: ${{ github.event.inputs.package_name }}"
          echo "UID: ${{ github.event.inputs.uid }}"

      - name: Create Dummy Android Project (Java/Kotlin)
        run: |
          # Membuat struktur dasar project Android sederhana untuk Worker
          mkdir -p app/src/main/java/com/guardian/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          
          # Buat AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${{ github.event.inputs.package_name }}">
              <application
                  android:label="${{ github.event.inputs.app_name }}"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Buat MainActivity.java dasar
          cat << 'EOF' > app/src/main/java/com/guardian/app/MainActivity.java
          package ${{ github.event.inputs.package_name }};
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(android.R.layout.activity_list_item);
              }
          }
          EOF

          # Buat build.gradle (Module: app)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '${{ github.event.inputs.package_name }}'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.inputs.package_name }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # Buat build.gradle (Project level)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          EOF

          # Buat settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOSITORIES)
              repositories {
                  google()
                  
